<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="On The Line: Puzzle Game — A minimalist puzzle game by Jongwon Lee">
  <meta name="base-url" content="">
  <meta name="content-project" content="on-the-line">
  <title>On The Line — jlee</title>

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">

  <style>
    .game-hero {
      padding: var(--space-16) 0 var(--space-12);
      border-bottom: 1px solid var(--color-border);
      margin-bottom: var(--space-12);
    }

    .game-hero h1 {
      font-size: var(--text-3xl);
      margin-bottom: var(--space-3);
    }

    .game-hero p {
      color: var(--color-text-muted);
      max-width: 480px;
      margin-bottom: var(--space-8);
    }

    .game-hero-links {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
      align-items: center;
    }

    .game-link {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      text-decoration: underline;
      transition: color var(--transition-fast);
    }

    .game-link:hover {
      color: var(--color-accent);
    }

    .game-hero-inner {
      display: flex;
      gap: var(--space-6);
      align-items: flex-start;
    }

    .game-logo {
      width: 88px;
      height: 88px;
      border-radius: var(--radius-lg);
      flex-shrink: 0;
    }

    /* 화면이 여러 장이라 좌우로 넘겨 본다. 한 장씩 딱 맞게 멈추도록 스냅을 건다. */
    .screenshots-grid {
      display: flex;
      flex-wrap: nowrap;
      gap: var(--space-4);
      margin-bottom: var(--space-12);
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scroll-snap-type: x proximity;
      padding-bottom: var(--space-3);
      -webkit-overflow-scrolling: touch;
    }

    .screenshots-grid img {
      flex: 0 0 auto;
      width: 240px;
      scroll-snap-align: start;
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
    }

    .screenshots-grid::-webkit-scrollbar {
      height: 8px;
    }

    .screenshots-grid::-webkit-scrollbar-thumb {
      background: var(--color-border);
      border-radius: 4px;
    }

    @media (max-width: 640px) {
      .game-hero-inner {
        flex-direction: column;
      }

      .screenshots-grid {
        gap: var(--space-2);
      }
    }
  </style>
</head>
<body>

  <nav class="nav" role="navigation" aria-label="Main navigation">
    <div class="container nav-inner">
      <div class="nav-breadcrumb">
        <a href="/" class="nav-logo" aria-label="Home">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </a>
        <span class="nav-breadcrumb-sep">/</span>
        <span class="nav-breadcrumb-link">On The Line</span>
      </div>
      <div class="nav-actions">
        <a href="/work/journal/" class="nav-icon" data-i18n-title="nav.journal" title="Work History" aria-label="Work History">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <polyline points="12 7 12 12 15.5 14"/>
          </svg>
        </a>
        <div class="lang-selector">
          <button class="lang-option" data-lang="en">EN</button>
          <button class="lang-option" data-lang="ko">KO</button>
        </div>
      </div>
    </div>
  </nav>

  <main>
    <div class="container">

      <div class="game-hero">
        <div class="game-hero-inner">
          <img src="/life/on-the-line/ontheline_logo_strawberry.png" alt="On The Line logo" class="game-logo">
          <div>
            <h1>On The Line: Puzzle Game</h1>
            <p style="margin-bottom: 0;" data-i18n="otl.tagline.line1">Move, Line Up, And Clear!</p>
            <p data-i18n="otl.tagline.line2">Simple yet addictive line puzzle game!</p>
            <div class="skill-tags" id="project-tags" style="margin: var(--space-5) 0 var(--space-6);"></div>
            <div class="game-hero-links">
              <a href="https://apps.apple.com/app/id6760333150" target="_blank" rel="noopener noreferrer" class="game-link" data-i18n="games.appstore">App Store</a>
              <a href="https://minion.toss.im/j7201NV" target="_blank" rel="noopener noreferrer" class="game-link">Apps in Toss</a>
              <a href="/life/on-the-line/privacy.html" class="game-link" data-i18n="games.privacy">Privacy Policy</a>
              <a href="/life/on-the-line/support.html" class="game-link" data-i18n="games.support">Support</a>
            </div>
          </div>
        </div>
      </div>

      <div class="screenshots-grid">
        <img src="/life/on-the-line/IMG_5281.PNG" alt="Fruits gameplay">
        <img src="/life/on-the-line/IMG_5283.PNG" alt="Combo clear">
        <img src="/life/on-the-line/toss-ingame-desserts.png" alt="Dessert Party piece set in play">
        <img src="/life/on-the-line/IMG_5284.PNG" alt="Game over">
        <img src="/life/on-the-line/toss-menu.png" alt="In-game menu">
        <img src="/life/on-the-line/toss-start.png" alt="Start screen">
        <img src="/life/on-the-line/toss-profile.png" alt="Profile with lifetime records">
        <img src="/life/on-the-line/toss-pieceset-locked.png" alt="Piece set list">
        <img src="/life/on-the-line/toss-mission.png" alt="Unlock conditions for the Dessert Party set">
        <img src="/life/on-the-line/toss-pieceset-unlocked.png" alt="Dessert Party unlocked">
        <img src="/life/on-the-line/toss-records.png" alt="Top score records">
      </div>

      <!--
        작업 내역은 content/journal/*.md 에서 읽어온다.
        /work/journal/ 과 같은 원본·같은 렌더러를 쓰므로 두 곳이 어긋나지 않는다.
      -->
      <section class="section" id="journal-section" style="padding-top: 0;" hidden>
        <hr class="divider">
        <div id="journal-root"></div>
      </section>

    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span class="footer-copy">© <span id="year"></span> Jongwon Lee. <span data-i18n="footer.rights">All rights reserved.</span></span>
      <div class="footer-links">
      </div>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/content.js"></script>
  <script>
    const PROJECT_ID = document.querySelector('meta[name="content-project"]').content;

    // 태그는 content/projects/on-the-line.md 하나만 보고 그린다.
    // 여기에 직접 쓰면 포폴 카드·프로젝트 상세와 어긋난다.
    async function renderProject() {
      const idx = await Content.index();
      const project = (idx.projects || []).find(p => p.id === PROJECT_ID);
      if (project) {
        document.getElementById('project-tags').innerHTML =
          project.tags.map(t => `<span class="tag">${Content.escapeHtml(t)}</span>`).join('');
      }

      // 이 페이지가 곧 프로젝트 페이지라, 항목마다 프로젝트 이름을 다시 붙이지 않는다.
      const entries = Content.journalFor(idx, PROJECT_ID);
      if (!entries.length) return;
      const root = document.getElementById('journal-root');
      root.innerHTML = `<div class="timeline">${
        entries.map(e => Content.entryHtml(e, { showProject: false })).join('')}</div>`;
      Content.bindEntryToggles(root);
      document.getElementById('journal-section').hidden = false;
    }

    // 언어가 바뀌면 다시 그린다 (i18n.js 가 적용 후 이 이벤트를 쏜다).
    document.addEventListener('i18n:applied', renderProject);
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
