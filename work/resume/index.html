<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jongwon Lee — Resume">
  <meta name="base-url" content="">
  <title>Resume — jlee</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <style>
    .resume-layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: var(--space-12);
      align-items: start;
    }

    .resume-sidebar {
      position: sticky;
      top: calc(var(--nav-height) + var(--space-8));
    }

    .sidebar-card {
      background: var(--color-bg-subtle);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      margin-bottom: var(--space-4);
    }

    .sidebar-card-title {
      font-size: var(--text-xs);
      font-weight: var(--font-semibold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-text-muted);
      margin-bottom: var(--space-4);
    }

    @media (max-width: 900px) {
      .resume-layout {
        grid-template-columns: 1fr;
      }
      .resume-sidebar {
        position: static;
        order: -1;
      }
    }
  </style>
</head>
<body>

  <nav class="nav" role="navigation" aria-label="Main navigation">
    <div class="container nav-inner">
      <div class="nav-breadcrumb">
        <a href="/" class="nav-logo" aria-label="Home">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </a>
        <span class="nav-breadcrumb-sep">/</span>
        <a href="/work/resume/" class="nav-breadcrumb-link" data-i18n="nav.resume">Resume</a>
      </div>
      <div class="nav-actions">
        <a href="/work/journal/" class="nav-icon" data-i18n-title="nav.journal" title="Work History" aria-label="Work History">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <polyline points="12 7 12 12 15.5 14"/>
          </svg>
        </a>
        <div class="lang-selector">
          <button class="lang-option" data-lang="en">EN</button>
          <button class="lang-option" data-lang="ko">KO</button>
        </div>
      </div>
    </div>
  </nav>

  <main>
    <div class="container">
      <div class="page-hero">
        <h1 data-i18n="resume.title">Resume</h1>
        <p data-i18n="resume.subtitle">Experience, education, and skills</p>
      </div>

      <!--
        경력·학력·스킬은 content/resume/ 아래 md 파일에서 읽어온다.
        수정 후 `python3 tools/build_index.py` 실행.
      -->
      <div class="resume-layout">
        <div>
          <section class="section" style="padding-top: 0;">
            <div class="section-header">
              <h2 class="section-title" data-i18n="resume.section.experience">Experience</h2>
            </div>
            <div id="experience"></div>
          </section>

          <hr class="divider">

          <section class="section">
            <div class="section-header">
              <h2 class="section-title" data-i18n="resume.section.education">Education</h2>
            </div>
            <div id="education"></div>
          </section>
        </div>

        <aside class="resume-sidebar">
          <div class="sidebar-card">
            <div class="sidebar-card-title" data-i18n="resume.download">Download PDF</div>
            <!-- PDF 업로드 후 href 를 실제 경로로 교체 -->
            <a href="#" class="btn btn-primary" style="width:100%; justify-content:center;" data-i18n="resume.download">Download PDF</a>
          </div>

          <div class="sidebar-card">
            <div class="sidebar-card-title" data-i18n="resume.section.skills">Skills</div>
            <div id="skills"></div>
          </div>

          <div class="sidebar-card">
            <div class="sidebar-card-title" data-i18n="resume.section.links">Links</div>
            <div class="footer-links" id="resume-links" style="flex-direction: column; align-items: flex-start; gap: var(--space-3);"></div>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span class="footer-copy">© <span id="year"></span> Jongwon Lee. <span data-i18n="footer.rights">All rights reserved.</span></span>
      <div class="footer-links">
        <a href="https://www.linkedin.com/in/%EC%A2%85%EC%9B%90-%EC%9D%B4-597746136/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="https://github.com/jleesdev" target="_blank" rel="noopener noreferrer">GitHub</a>
      </div>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/content.js"></script>
  <script>
    function timeline(items) {
      if (!items.length) return `<p class="empty-state">${Content.escapeHtml(t('resume.empty'))}</p>`;

      const rows = items.map(item => {
        const body = Content.markdown(Content.pick(item.body));
        return `
          <div class="timeline-item">
            <div class="timeline-date">${Content.escapeHtml(Content.pick(item.period))}</div>
            <div class="timeline-title">${Content.escapeHtml(Content.pick(item.title))}</div>
            <div class="timeline-org">${Content.escapeHtml(Content.pick(item.org))}</div>
            ${body ? `<div class="timeline-body md-body">${body}</div>` : ''}
          </div>`;
      }).join('');

      return `<div class="timeline">${rows}</div>`;
    }

    function skills(groups) {
      return groups.map((group, i) => `
        <div style="margin-bottom: ${i === groups.length - 1 ? '0' : 'var(--space-5)'};">
          <div class="skill-group-title">${Content.escapeHtml(group.label)}</div>
          <div class="skill-tags">
            ${group.items.map(item => `<span class="tag">${Content.escapeHtml(item)}</span>`).join('')}
          </div>
        </div>`).join('');
    }

    async function render() {
      const idx = await Content.index();
      const resume = idx.resume || {};

      document.getElementById('experience').innerHTML = timeline(resume.experience || []);
      document.getElementById('education').innerHTML = timeline(resume.education || []);
      document.getElementById('skills').innerHTML = skills(resume.skills || []);
      document.getElementById('resume-links').innerHTML = Content.renderLinks(resume.links || []);
    }

    document.addEventListener('i18n:applied', render);
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
