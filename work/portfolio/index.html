<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jongwon Lee — Portfolio">
  <meta name="base-url" content="">
  <title>Portfolio — jlee</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>

  <nav class="nav" role="navigation" aria-label="Main navigation">
    <div class="container nav-inner">
      <div class="nav-breadcrumb">
        <a href="/" class="nav-logo" aria-label="Home">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </a>
        <span class="nav-breadcrumb-sep">/</span>
        <a href="/work/portfolio/" class="nav-breadcrumb-link" data-i18n="nav.portfolio">Portfolio</a>
      </div>
      <div class="nav-actions">
        <a href="/work/journal/" class="nav-icon" data-i18n-title="nav.journal" title="Work History" aria-label="Work History">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <polyline points="12 7 12 12 15.5 14"/>
          </svg>
        </a>
        <div class="lang-selector">
          <button class="lang-option" data-lang="en">EN</button>
          <button class="lang-option" data-lang="ko">KO</button>
        </div>
      </div>
    </div>
  </nav>

  <main>
    <div class="container">
      <div class="page-hero">
        <h1 data-i18n="portfolio.title">Portfolio</h1>
        <p data-i18n="portfolio.subtitle">Things I've designed and built</p>
      </div>

      <!--
        프로젝트는 content/projects/*.md 에서 읽어온다.
        추가/수정은 그 md 파일을 고친 뒤 `python3 tools/build_index.py` 실행.
        showcase: true 인 프로젝트만 이 페이지에 나온다.
      -->
      <section class="section" style="padding-top: 0;">
        <div class="projects-grid" id="projects"></div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span class="footer-copy">© <span id="year"></span> Jongwon Lee. <span data-i18n="footer.rights">All rights reserved.</span></span>
      <div class="footer-links">
        <a href="https://www.linkedin.com/in/%EC%A2%85%EC%9B%90-%EC%9D%B4-597746136/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="https://github.com/jleesdev" target="_blank" rel="noopener noreferrer">GitHub</a>
      </div>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/content.js"></script>
  <script>
    const projectsEl = document.getElementById('projects');

    function card(project) {
      // 프로젝트 전용 페이지(page)가 있으면 그쪽으로, 없으면 공용 상세로 보낸다.
      const href = project.page || `/work/project/?id=${encodeURIComponent(project.id)}`;
      const title = Content.escapeHtml(Content.pick(project.title));
      // 요약의 \n 은 줄바꿈으로 그린다. frontmatter 가 한 줄짜리라 실제 개행을 못 담는다.
      const summary = Content.escapeHtml(Content.pick(project.summary)).replace(/\\n/g, '<br>');

      // 카드 전체가 링크다. 안에 또 링크를 두면 어디를 눌러야 할지 흐려지고,
      // 중첩 <a> 는 HTML 상으로도 성립하지 않는다.
      return `
        <a class="project-card" href="${href}">
          <div class="project-card-body">
            <div class="project-card-head">
              ${project.icon ? `<img class="project-card-icon" src="${Content.escapeHtml(project.icon)}" alt="">` : ''}
              <div class="project-card-headtext">
                <div class="project-card-title">${title}</div>
                <div class="project-card-desc">${summary}</div>
              </div>
            </div>
            <div class="skill-tags">
              ${project.tags.map(tag => `<span class="tag">${Content.escapeHtml(tag)}</span>`).join('')}
            </div>
          </div>
        </a>`;
    }

    async function render() {
      const idx = await Content.index();
      const showcased = (idx.projects || []).filter(p => p.showcase);

      if (!showcased.length) {
        projectsEl.innerHTML = `<p class="empty-state">${Content.escapeHtml(t('portfolio.empty'))}</p>`;
        return;
      }

      projectsEl.innerHTML = showcased.map(card).join('');
    }

    document.addEventListener('i18n:applied', render);
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
